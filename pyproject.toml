[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "illuin-tt"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "omegaconf>=2.4.0",
    "pandas>=3.1.1",
    "peft>=0.21.3",
    "scikit-multilearn>=0.2.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "umap-learn>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["illuin_tt"]
exclude = []
namespaces = false
